<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매매 일지 — Process over Picks</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'system-ui', 'sans-serif'],
            mono: ['Source Code Pro', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    body.light { background: #f8f8f6; }
    body.dark { background: #09090b; }
    ::selection { background: #f59e0b33; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: none; }
    .dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
  </style>
</head>
<body class="light">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const STORAGE_KEY = "junhyung_trades";
const THEME_KEY = "junhyung_theme";

const THEMES_LIST = [
  "희토류/핵심광물 롱", "우라늄 롱", "매크로/원자재(유가·FX)",
  "AI인프라 숏", "양자/스페이스/크립토 숏", "스토리주 숏(기타)",
  "개별주 롱", "지수 옵션", "기타",
];
const VEHICLES = [
  "주식", "콜 (단기, 1달내)", "콜 (장기)", "풋 (단기, 1달내)",
  "풋 (장기)", "스프레드", "데일리 레버리지 ETF/ETN", "기타",
];
const HORIZONS = ["당일~며칠", "몇 주", "몇 달", "장기"];
const SHORT_VEHICLE = new Set(["콜 (단기, 1달내)", "풋 (단기, 1달내)", "데일리 레버리지 ETF/ETN"]);
const LONG_HORIZON = new Set(["몇 주", "몇 달", "장기"]);

const load = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } };
const save = (data) => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

const JOURNAL_KEY = "junhyung_journal";
const loadJournal = () => { try { return JSON.parse(localStorage.getItem(JOURNAL_KEY)) || { folders: [], notes: [] }; } catch { return { folders: [], notes: [] }; } };
const saveJournal = (data) => localStorage.setItem(JOURNAL_KEY, JSON.stringify(data));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmtFull = (d) => d ? new Date(d).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" }) : "";
const fmtMoney = (n) => isNaN(n) || n === null || n === "" ? "—" : Number(n).toLocaleString("ko-KR");
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("ko-KR", { month: "short", day: "numeric" }) : "";

const emptyForm = {
  ticker: "", direction: "long", vehicle: "주식", thesis: "", reasons: "",
  invalidation: "", horizon: "몇 주", theme: THEMES_LIST[0], catalyst: "",
  catalystDate: "", maxLoss: "", entryPrice: "", entryDate: new Date().toISOString().slice(0, 10),
};

// ---- THEME COLORS ----
const T = {
  light: {
    bg: "bg-stone-50", text: "text-zinc-800", textSub: "text-zinc-500", textMuted: "text-zinc-400",
    card: "rounded-lg border border-zinc-200 bg-white shadow-sm", cardInner: "bg-zinc-50",
    input: "w-full rounded-md border border-zinc-300 bg-white px-3 py-2.5 text-sm text-zinc-800 placeholder-zinc-400 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/20 transition-colors",
    label: "block text-xs font-medium tracking-wide text-zinc-500 mb-1.5",
    navActive: "border-amber-600 text-amber-700", navInactive: "border-transparent text-zinc-400 hover:text-zinc-600",
    badge: "bg-zinc-100 text-zinc-500", bar: "bg-zinc-200", barFill: "bg-zinc-400",
    barWarn: "bg-rose-400", barMid: "bg-amber-400",
    headerBg: "", border: "border-zinc-200", borderHover: "hover:border-zinc-400",
    btnPrimary: "bg-amber-600 text-white hover:bg-amber-500",
    btnSecondary: "border border-zinc-300 text-zinc-500 hover:border-zinc-400 hover:text-zinc-700",
    dirLong: "border-emerald-400 bg-emerald-50 text-emerald-700", dirShort: "border-rose-400 bg-rose-50 text-rose-700",
    dirLongInactive: "border-zinc-300 text-zinc-400 hover:border-zinc-400", dirShortInactive: "border-zinc-300 text-zinc-400 hover:border-zinc-400",
    tagLong: "bg-emerald-50 text-emerald-600 border border-emerald-200", tagShort: "bg-rose-50 text-rose-600 border border-rose-200",
    mismatch: "border-amber-300 bg-amber-50 text-amber-700",
    closeRight: "border-sky-400 bg-sky-50 text-sky-700", closeWrong: "border-orange-400 bg-orange-50 text-orange-700",
    closeInactive: "border-zinc-300 text-zinc-400",
    pnlUp: "text-emerald-600", pnlDown: "text-rose-600",
    qEmerald: "border-emerald-200 bg-emerald-50/80", qAmber: "border-amber-200 bg-amber-50/80",
    qSky: "border-sky-200 bg-sky-50/80", qZinc: "border-zinc-200 bg-zinc-50",
    qEmeraldText: "text-emerald-700", qAmberText: "text-amber-700", qSkyText: "text-sky-700", qZincText: "text-zinc-600",
    qEmeraldNum: "text-emerald-500", qAmberNum: "text-amber-500", qSkyNum: "text-sky-500", qZincNum: "text-zinc-400",
    closedBorderSkill: "border-l-emerald-500", closedBorderLuck: "border-l-amber-500",
    closedBorderStruct: "border-l-sky-500", closedBorderNormal: "border-l-zinc-300",
    closedBg: "bg-zinc-50/80 border-zinc-200",
    toast: "border-amber-300 bg-amber-50 text-amber-800",
    footer: "text-zinc-300",
  },
  dark: {
    bg: "bg-zinc-950", text: "text-zinc-200", textSub: "text-zinc-500", textMuted: "text-zinc-600",
    card: "rounded-lg border border-zinc-800 bg-zinc-900/80 backdrop-blur-sm", cardInner: "bg-zinc-950/80",
    input: "w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 outline-none focus:border-amber-500/60 transition-colors",
    label: "block text-xs font-medium tracking-wide text-zinc-400 mb-1.5",
    navActive: "border-amber-500 text-amber-400", navInactive: "border-transparent text-zinc-500 hover:text-zinc-300",
    badge: "bg-zinc-800 text-zinc-400", bar: "bg-zinc-800", barFill: "bg-zinc-500",
    barWarn: "bg-rose-500", barMid: "bg-amber-600",
    headerBg: "", border: "border-zinc-800", borderHover: "hover:border-zinc-700",
    btnPrimary: "bg-amber-500 text-zinc-950 hover:bg-amber-400",
    btnSecondary: "border border-zinc-700 text-zinc-400 hover:text-zinc-300",
    dirLong: "border-emerald-600 bg-emerald-950/60 text-emerald-300", dirShort: "border-rose-600 bg-rose-950/60 text-rose-300",
    dirLongInactive: "border-zinc-700 text-zinc-500 hover:border-zinc-600", dirShortInactive: "border-zinc-700 text-zinc-500 hover:border-zinc-600",
    tagLong: "bg-emerald-950 text-emerald-400 border border-emerald-800/50", tagShort: "bg-rose-950 text-rose-400 border border-rose-800/50",
    mismatch: "border-amber-700/40 bg-amber-950/30 text-amber-300",
    closeRight: "border-sky-600 bg-sky-950/60 text-sky-300", closeWrong: "border-orange-600 bg-orange-950/60 text-orange-300",
    closeInactive: "border-zinc-700 text-zinc-500",
    pnlUp: "text-emerald-400", pnlDown: "text-rose-400",
    qEmerald: "border-emerald-800/60 bg-emerald-950/20", qAmber: "border-amber-800/60 bg-amber-950/20",
    qSky: "border-sky-800/60 bg-sky-950/20", qZinc: "border-zinc-700 bg-zinc-900/50",
    qEmeraldText: "text-emerald-300", qAmberText: "text-amber-300", qSkyText: "text-sky-300", qZincText: "text-zinc-300",
    qEmeraldNum: "text-emerald-400", qAmberNum: "text-amber-400", qSkyNum: "text-sky-400", qZincNum: "text-zinc-400",
    closedBorderSkill: "border-l-emerald-500", closedBorderLuck: "border-l-amber-500",
    closedBorderStruct: "border-l-sky-500", closedBorderNormal: "border-l-zinc-600",
    closedBg: "bg-zinc-900/50 border-zinc-800",
    toast: "border-amber-800/50 bg-amber-950/90 text-amber-200",
    footer: "text-zinc-800",
  }
};

function App() {
  const [trades, setTrades] = useState(load);
  const [view, setView] = useState("gate");
  const [form, setForm] = useState(emptyForm);
  const [errors, setErrors] = useState({});
  const [closingId, setClosingId] = useState(null);
  const [closeForm, setCloseForm] = useState({ exitPrice: "", pnl: "", thesisRight: null, note: "" });
  const [toast, setToast] = useState(null);
  const [dark, setDark] = useState(() => localStorage.getItem(THEME_KEY) === "dark");

  // ---- journal state ----
  const [journal, setJournal] = useState(loadJournal);
  const [curFolder, setCurFolder] = useState(null);   // 현재 폴더 id (null = 루트)
  const [editingId, setEditingId] = useState(null);    // 편집 중인 글 id ("new" = 새 글, null = 목록)
  const [draft, setDraft] = useState({ title: "", body: "", date: "" });

  useEffect(() => { saveJournal(journal); }, [journal]);

  useEffect(() => { save(trades); }, [trades]);
  useEffect(() => {
    document.body.className = dark ? "dark" : "light";
    localStorage.setItem(THEME_KEY, dark ? "dark" : "light");
  }, [dark]);

  const c = dark ? T.dark : T.light;
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

  const open = trades.filter(t => t.status === "open");
  const closed = trades.filter(t => t.status === "closed");
  const vehicleMismatch = SHORT_VEHICLE.has(form.vehicle) && LONG_HORIZON.has(form.horizon);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const validate = () => {
    const e = {};
    if (!form.ticker.trim()) e.ticker = "티커 입력";
    if (!form.thesis.trim()) e.thesis = "thesis 한 줄은 필수";
    if (!form.invalidation.trim()) e.invalidation = "무효화 조건 없으면 진입 금지";
    if (form.direction === "short" && (!form.catalyst.trim() || !form.catalystDate))
      e.catalyst = "숏은 임박한 카탈리스트 + 날짜 필수";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = () => {
    if (!validate()) return;
    const t = { ...form, id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), status: "open", createdAt: new Date().toISOString() };
    setTrades([t, ...trades]);
    setForm({ ...emptyForm, entryDate: new Date().toISOString().slice(0, 10) });
    setErrors({});
    showToast(`${t.ticker} 포지션 기록됨`);
    setView("positions");
  };

  const beginClose = (id) => { setClosingId(id); setCloseForm({ exitPrice: "", pnl: "", thesisRight: null, note: "" }); };

  const confirmClose = (id) => {
    if (closeForm.thesisRight === null || closeForm.pnl === "") return;
    setTrades(trades.map(t => t.id === id ? { ...t, status: "closed", exitPrice: closeForm.exitPrice, pnl: Number(closeForm.pnl), thesisRight: closeForm.thesisRight, note: closeForm.note, closedAt: new Date().toISOString() } : t));
    setClosingId(null);
    showToast("청산 기록 완료 → 복기 탭에서 확인");
  };

  const remove = (id) => { if (confirm("이 기록을 삭제할까?")) setTrades(trades.filter(t => t.id !== id)); };

  const quadrant = (t) => {
    const won = t.pnl > 0;
    if (t.thesisRight && won) return "skill";
    if (!t.thesisRight && won) return "luck";
    if (t.thesisRight && !won) return "structure";
    return "normal";
  };

  const quad = useMemo(() => {
    const g = { skill: [], luck: [], structure: [], normal: [] };
    closed.forEach(t => g[quadrant(t)].push(t));
    return g;
  }, [closed]);

  const concentration = useMemo(() => {
    const total = open.reduce((s, t) => s + (Number(t.maxLoss) || 0), 0);
    const byTheme = {};
    open.forEach(t => { byTheme[t.theme] = (byTheme[t.theme] || 0) + (Number(t.maxLoss) || 0); });
    return Object.entries(byTheme).map(([theme, risk]) => ({ theme, risk, pct: total ? (risk / total) * 100 : 0 })).sort((a, b) => b.risk - a.risk);
  }, [open]);

  const totalRealized = closed.reduce((s, t) => s + (Number(t.pnl) || 0), 0);

  const exportData = () => {
    const blob = new Blob([JSON.stringify(trades, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `trades_${new Date().toISOString().slice(0,10)}.json`; a.click();
  };
  const importData = () => {
    const input = document.createElement("input"); input.type = "file"; input.accept = ".json";
    input.onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (ev) => { try { const d = JSON.parse(ev.target.result); if (Array.isArray(d)) { setTrades(d); showToast(`${d.length}건 불러옴`); } } catch { showToast("파일 형식 오류"); } };
      reader.readAsText(e.target.files[0]);
    };
    input.click();
  };

  // ---- journal helpers ----
  const descendantFolderIds = (rootId) => {
    const ids = [rootId];
    const walk = (pid) => journal.folders.filter(f => f.parentId === pid).forEach(f => { ids.push(f.id); walk(f.id); });
    walk(rootId);
    return ids;
  };
  const addFolder = () => {
    const name = prompt("폴더 이름 (예: 2026-06, 6월 1주차, 06-08)");
    if (!name || !name.trim()) return;
    setJournal(j => ({ ...j, folders: [...j.folders, { id: uid(), name: name.trim(), parentId: curFolder, createdAt: new Date().toISOString() }] }));
  };
  const renameFolder = (id, e) => {
    e.stopPropagation();
    const f = journal.folders.find(x => x.id === id);
    const name = prompt("폴더 이름 변경", f ? f.name : "");
    if (!name || !name.trim()) return;
    setJournal(j => ({ ...j, folders: j.folders.map(x => x.id === id ? { ...x, name: name.trim() } : x) }));
  };
  const deleteFolder = (id, e) => {
    e.stopPropagation();
    const ids = descendantFolderIds(id);
    const noteCount = journal.notes.filter(n => ids.includes(n.folderId)).length;
    const subCount = ids.length - 1;
    if (!confirm(`이 폴더를 삭제할까?\n하위 폴더 ${subCount}개, 글 ${noteCount}개도 함께 삭제됨. 되돌릴 수 없음.`)) return;
    setJournal(j => ({
      folders: j.folders.filter(f => !ids.includes(f.id)),
      notes: j.notes.filter(n => !ids.includes(n.folderId)),
    }));
    if (ids.includes(curFolder)) setCurFolder(null);
  };
  const newNote = () => { setDraft({ title: "", body: "", date: new Date().toISOString().slice(0, 10) }); setEditingId("new"); };
  const openNote = (n) => { setDraft({ title: n.title, body: n.body, date: n.date }); setEditingId(n.id); };
  const saveNote = () => {
    if (!draft.body.trim() && !draft.title.trim()) { setEditingId(null); return; }
    const now = new Date().toISOString();
    if (editingId === "new") {
      const n = { id: uid(), folderId: curFolder, title: draft.title.trim(), body: draft.body, date: draft.date || now.slice(0, 10), createdAt: now, updatedAt: now };
      setJournal(j => ({ ...j, notes: [n, ...j.notes] }));
    } else {
      setJournal(j => ({ ...j, notes: j.notes.map(n => n.id === editingId ? { ...n, title: draft.title.trim(), body: draft.body, date: draft.date, updatedAt: now } : n) }));
    }
    setEditingId(null);
    showToast("일지 저장됨");
  };
  const deleteNote = (id) => { if (confirm("이 글을 삭제할까?")) { setJournal(j => ({ ...j, notes: j.notes.filter(n => n.id !== id) })); setEditingId(null); } };
  const folderPath = (id) => {
    const path = []; let cur = id;
    while (cur) { const f = journal.folders.find(x => x.id === cur); if (!f) break; path.unshift(f); cur = f.parentId; }
    return path;
  };
  const exportJournal = () => {
    const blob = new Blob([JSON.stringify(journal, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `journal_${new Date().toISOString().slice(0,10)}.json`; a.click();
  };
  const importJournal = () => {
    const input = document.createElement("input"); input.type = "file"; input.accept = ".json";
    input.onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (ev) => { try { const d = JSON.parse(ev.target.result); if (d && Array.isArray(d.folders) && Array.isArray(d.notes)) { setJournal(d); showToast(`폴더 ${d.folders.length} · 글 ${d.notes.length}건 불러옴`); } else showToast("일지 형식 아님"); } catch { showToast("파일 형식 오류"); } };
      reader.readAsText(e.target.files[0]);
    };
    input.click();
  };

  const subfolders = journal.folders.filter(f => (f.parentId || null) === (curFolder || null)).sort((a, b) => a.name.localeCompare(b.name, "ko"));
  const notesHere = journal.notes.filter(n => (n.folderId || null) === (curFolder || null)).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || "").localeCompare(a.createdAt || ""));
  const crumbs = folderPath(curFolder);

  const NavBtn = ({ id, children, badge }) => (
    <button onClick={() => setView(id)} className={"px-4 py-2.5 text-sm font-medium tracking-wide transition-all border-b-2 " + (view === id ? c.navActive : c.navInactive)}>
      {children}
      {badge != null && <span className={"ml-2 rounded-full px-2 py-0.5 text-xs font-mono " + c.badge}>{badge}</span>}
    </button>
  );

  return (
    <div className={"min-h-screen font-sans " + c.bg + " " + c.text}>
      {toast && <div className={"fixed top-4 left-1/2 -translate-x-1/2 z-50 rounded-lg border px-5 py-2.5 text-sm shadow-lg " + c.toast}>{toast}</div>}

      <div className="mx-auto max-w-3xl px-5 py-8">
        {/* Header */}
        <div className="mb-8 flex items-start justify-between">
          <div>
            <h1 className={"text-2xl font-bold tracking-tight " + c.text} style={{fontFamily:"Georgia, 'Noto Serif KR', serif"}}>
              매매 일지 <span className="text-amber-600">/</span> <span className={c.textSub + " text-base font-normal font-sans"}>Process over Picks</span>
            </h1>
            <p className={"mt-1.5 text-xs " + c.textMuted}>게이트 통과 → 얇은 로그 → 2×2 복기. 결과가 아니라 의사결정을 기록한다.</p>
            <div className="mt-3 flex gap-3 text-xs">
              <button onClick={exportData} className={c.textMuted + " hover:text-amber-600 transition-colors"}>↓ 내보내기</button>
              <button onClick={importData} className={c.textMuted + " hover:text-amber-600 transition-colors"}>↑ 불러오기</button>
            </div>
          </div>
          <button onClick={() => setDark(d => !d)} className={"mt-1 rounded-full border px-3 py-1.5 text-xs transition-colors " + c.btnSecondary}>
            {dark ? "☀ 라이트" : "🌙 다크"}
          </button>
        </div>

        {/* Nav */}
        <div className={"mb-6 flex gap-1 border-b " + c.border}>
          <NavBtn id="gate">진입 게이트</NavBtn>
          <NavBtn id="positions" badge={open.length}>포지션</NavBtn>
          <NavBtn id="review" badge={closed.length}>복기</NavBtn>
          <NavBtn id="journal" badge={journal.notes.length || null}>일지</NavBtn>
        </div>

        {/* ========== GATE ========== */}
        {view === "gate" && (
          <div className={c.card + " p-6"}>
            <div className="mb-5 flex items-baseline justify-between">
              <h2 className={"text-sm font-semibold tracking-wide " + c.text}>진입 전 5문항</h2>
              <span className={"text-xs italic " + c.textMuted}>통과 못 하면 진입하지 않는다</span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className={c.label}>티커 / 종목</label>
                <input className={c.input} value={form.ticker} onChange={e => set("ticker", e.target.value.toUpperCase())} placeholder="GOOGL" />
                {errors.ticker && <p className="mt-1 text-xs text-rose-500">{errors.ticker}</p>}
              </div>
              <div>
                <label className={c.label}>방향</label>
                <div className="flex gap-2">
                  {["long","short"].map(d => (
                    <button key={d} onClick={() => set("direction", d)} className={"flex-1 rounded-md border px-3 py-2.5 text-sm font-medium transition-all " + (form.direction === d ? (d === "long" ? c.dirLong : c.dirShort) : (d === "long" ? c.dirLongInactive : c.dirShortInactive))}>
                      {d === "long" ? "롱 ▲" : "숏 ▼"}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="mt-5">
              <label className={c.label}>① 왜 지금? — thesis 한 줄</label>
              <input className={c.input} value={form.thesis} onChange={e => set("thesis", e.target.value)} placeholder="지정학 디스카운트로 눌렸고 OI 구조상 적정가 괴리" />
              {errors.thesis && <p className="mt-1 text-xs text-rose-500">{errors.thesis}</p>}
            </div>

            <div className="mt-4">
              <label className={c.label}>독립적 이유 나열 — <span className={c.textMuted}>이게 다 같은 이유의 변형은 아닌지 자문</span></label>
              <textarea className={c.input + " h-24 resize-none"} value={form.reasons} onChange={e => set("reasons", e.target.value)} placeholder={"1. ...\n2. ...\n3. ... (GOOGL=독립 3개 ✓ / CRM=같은 이유 3개 ✗)"} />
            </div>

            <div className="mt-4">
              <label className={c.label}>② 무효화 조건 — 어디까지 가면 내가 틀린 거냐</label>
              <input className={c.input} value={form.invalidation} onChange={e => set("invalidation", e.target.value)} placeholder="종가 $172 하회 시 / 실적 가이던스 하향 시" />
              {errors.invalidation && <p className="mt-1 text-xs text-rose-500">{errors.invalidation}</p>}
            </div>

            <div className="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className={c.label}>③ 도구</label>
                <select className={c.input} value={form.vehicle} onChange={e => set("vehicle", e.target.value)}>
                  {VEHICLES.map(v => <option key={v}>{v}</option>)}
                </select>
              </div>
              <div>
                <label className={c.label}>thesis 호라이즌</label>
                <select className={c.input} value={form.horizon} onChange={e => set("horizon", e.target.value)}>
                  {HORIZONS.map(h => <option key={h}>{h}</option>)}
                </select>
              </div>
            </div>
            {vehicleMismatch && (
              <div className={"mt-3 rounded-md border px-4 py-3 text-xs leading-relaxed " + c.mismatch}>
                ⚠ <strong>도구-호라이즌 미스매치:</strong> {form.horizon}짜리 thesis를 단기/감쇠형 도구로 표현하면 theta·decay가 엣지를 먹는다.
              </div>
            )}

            <div className="mt-4">
              <label className={c.label}>④ 테마 태그 — 이미 들고 있는 베팅의 복제인가?</label>
              <select className={c.input} value={form.theme} onChange={e => set("theme", e.target.value)}>
                {THEMES_LIST.map(t => <option key={t}>{t}</option>)}
              </select>
            </div>

            {form.direction === "short" && (
              <div className="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className={c.label}>카탈리스트 (숏 필수)</label>
                  <input className={c.input} value={form.catalyst} onChange={e => set("catalyst", e.target.value)} placeholder="록업 해제 / 증자 공시 / 실적" />
                </div>
                <div>
                  <label className={c.label}>예상 날짜</label>
                  <input type="date" className={c.input} value={form.catalystDate} onChange={e => set("catalystDate", e.target.value)} />
                </div>
                {errors.catalyst && <p className="sm:col-span-2 -mt-1 text-xs text-rose-500">{errors.catalyst}</p>}
              </div>
            )}

            <div className="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label className={c.label}>⑤ 최대손실 (원)</label>
                <input className={c.input} inputMode="numeric" value={form.maxLoss} onChange={e => set("maxLoss", e.target.value.replace(/[^0-9]/g,""))} placeholder="2,000,000" />
              </div>
              <div>
                <label className={c.label}>진입가</label>
                <input className={c.input} value={form.entryPrice} onChange={e => set("entryPrice", e.target.value)} placeholder="$1.35" />
              </div>
              <div>
                <label className={c.label}>진입일</label>
                <input type="date" className={c.input} value={form.entryDate} onChange={e => set("entryDate", e.target.value)} />
              </div>
            </div>

            <button onClick={submit} className={"mt-7 w-full rounded-md py-3 text-sm font-bold tracking-wide transition-colors " + c.btnPrimary}>
              게이트 통과 — 포지션 기록
            </button>
          </div>
        )}

        {/* ========== POSITIONS ========== */}
        {view === "positions" && (
          <div className="space-y-3">
            {open.length === 0 && (
              <div className={c.card + " p-10 text-center text-sm " + c.textSub}>열린 포지션 없음.<br/>진입 게이트에서 기록하면 여기 쌓인다.</div>
            )}
            {open.map(t => (
              <div key={t.id} className={c.card + " p-5 transition-colors " + c.borderHover}>
                <div className="flex items-start justify-between">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={"text-lg font-bold font-mono " + c.text}>{t.ticker}</span>
                    <span className={"rounded-full px-2 py-0.5 text-xs font-medium " + (t.direction === "long" ? c.tagLong : c.tagShort)}>
                      {t.direction === "long" ? "롱" : "숏"}
                    </span>
                    <span className={"text-xs " + c.textSub}>{t.vehicle}</span>
                  </div>
                  <span className={"rounded-full px-2.5 py-0.5 text-xs " + c.badge}>{t.theme}</span>
                </div>
                <p className={"mt-3 text-sm leading-relaxed " + c.text}>{t.thesis}</p>
                <div className={"mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs " + c.textSub}>
                  <div><span className={c.textMuted + " font-medium"}>무효화:</span> {t.invalidation}</div>
                  <div><span className={c.textMuted + " font-medium"}>호라이즌:</span> {t.horizon} · 진입 {t.entryPrice || "—"} ({fmtDate(t.entryDate)})</div>
                  {t.maxLoss && <div><span className={c.textMuted + " font-medium"}>최대손실:</span> {fmtMoney(t.maxLoss)}원</div>}
                  {t.direction === "short" && t.catalyst && <div><span className={c.textMuted + " font-medium"}>카탈리스트:</span> {t.catalyst} ({fmtDate(t.catalystDate)})</div>}
                </div>

                {closingId === t.id ? (
                  <div className={"mt-4 rounded-md border p-4 " + c.border + " " + c.cardInner}>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className={c.label}>청산가</label>
                        <input className={c.input} value={closeForm.exitPrice} onChange={e => setCloseForm(f => ({ ...f, exitPrice: e.target.value }))} placeholder="$8.00" />
                      </div>
                      <div>
                        <label className={c.label}>손익 (원, +/-)</label>
                        <input className={c.input} value={closeForm.pnl} onChange={e => setCloseForm(f => ({ ...f, pnl: e.target.value.replace(/[^0-9-]/g,"") }))} placeholder="-2000000" />
                      </div>
                    </div>
                    <div className="mt-4">
                      <label className={c.label}>thesis는 맞았나? (결과와 별개로)</label>
                      <div className="flex gap-2">
                        <button onClick={() => setCloseForm(f => ({ ...f, thesisRight: true }))} className={"flex-1 rounded-md border px-3 py-2.5 text-sm font-medium transition-all " + (closeForm.thesisRight === true ? c.closeRight : c.closeInactive)}>맞았음</button>
                        <button onClick={() => setCloseForm(f => ({ ...f, thesisRight: false }))} className={"flex-1 rounded-md border px-3 py-2.5 text-sm font-medium transition-all " + (closeForm.thesisRight === false ? c.closeWrong : c.closeInactive)}>틀렸음</button>
                      </div>
                    </div>
                    <input className={c.input + " mt-4"} value={closeForm.note} onChange={e => setCloseForm(f => ({ ...f, note: e.target.value }))} placeholder="복기 한 줄 (선택)" />
                    <div className="mt-4 flex gap-2">
                      <button onClick={() => confirmClose(t.id)} disabled={closeForm.thesisRight === null || closeForm.pnl === ""} className={"flex-1 rounded-md py-2.5 text-sm font-bold disabled:opacity-30 transition-colors " + c.btnPrimary}>청산 확정 → 복기로</button>
                      <button onClick={() => setClosingId(null)} className={"rounded-md px-4 text-sm transition-colors " + c.btnSecondary}>취소</button>
                    </div>
                  </div>
                ) : (
                  <div className="mt-4 flex gap-2">
                    <button onClick={() => beginClose(t.id)} className={"rounded-md border px-4 py-2 text-xs transition-colors " + c.btnSecondary + " hover:border-amber-500 hover:text-amber-600"}>청산 / 복기</button>
                    <button onClick={() => remove(t.id)} className={"rounded-md px-4 py-2 text-xs transition-colors " + c.textMuted + " hover:text-rose-500"}>삭제</button>
                  </div>
                )}
              </div>
            ))}

            {open.length > 0 && (
              <div className={c.card + " p-5"}>
                <h3 className={"mb-4 text-xs font-semibold tracking-widest uppercase " + c.textSub}>테마 집중도 — 열린 포지션 최대손실 기준</h3>
                {concentration.map(cc => (
                  <div key={cc.theme} className="mb-3">
                    <div className="mb-1.5 flex justify-between text-xs">
                      <span className={c.textSub}>{cc.theme}</span>
                      <span className={"font-mono " + (cc.pct > 30 ? c.pnlDown + " font-semibold" : c.textSub)}>{cc.pct.toFixed(0)}% · {fmtMoney(cc.risk)}원</span>
                    </div>
                    <div className={"h-2 w-full overflow-hidden rounded-full " + c.bar}>
                      <div className={"h-full rounded-full transition-all duration-500 " + (cc.pct > 30 ? c.barWarn : cc.pct > 20 ? c.barMid : c.barFill)} style={{ width: Math.min(cc.pct, 100) + "%" }} />
                    </div>
                  </div>
                ))}
                {concentration.some(cc => cc.pct > 30) && (
                  <p className={"mt-3 text-xs leading-relaxed " + c.pnlDown}>⚠ 한 테마가 30% 초과 — 종목 수와 무관하게 단일 베팅에 몰려 있다.</p>
                )}
              </div>
            )}
          </div>
        )}

        {/* ========== REVIEW ========== */}
        {view === "review" && (
          <div className="space-y-4">
            {closed.length === 0 ? (
              <div className={c.card + " p-10 text-center text-sm " + c.textSub}>청산된 트레이드가 없음.<br/>포지션을 청산하면 여기서 2×2로 분류된다.</div>
            ) : (
              <>
                <div className="flex items-center justify-between px-1 text-xs">
                  <span className={c.textSub + " font-mono"}>청산 {closed.length}건</span>
                  <span className={"font-mono font-semibold " + (totalRealized >= 0 ? c.pnlUp : c.pnlDown)}>
                    실현손익 {totalRealized >= 0 ? "+" : ""}{fmtMoney(totalRealized)}원
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <QuadCard c={c} title="실력" sub="맞고 + 벌었" qKey="emerald" note="이 트레이드를 반복해라" list={quad.skill} />
                  <QuadCard c={c} title="운" sub="틀리고 + 벌었" qKey="amber" note="제일 위험한 승리 — 나쁜 습관이 강화된다" list={quad.luck} />
                  <QuadCard c={c} title="구조 문제" sub="맞고 + 잃었" qKey="sky" note="사이징·타이밍·도구를 고쳐라" list={quad.structure} />
                  <QuadCard c={c} title="정상" sub="틀리고 + 잃었" qKey="zinc" note="thesis 자체를 다시 봐" list={quad.normal} />
                </div>

                <div className={c.card + " p-4"}>
                  <div className={"flex gap-6 text-xs " + c.textSub}>
                    <div><span className={c.textMuted}>승률:</span> <span className={"font-mono " + c.text}>{(closed.filter(t => t.pnl > 0).length / closed.length * 100).toFixed(0)}%</span></div>
                    <div><span className={c.textMuted}>실력 비중:</span> <span className={"font-mono " + c.pnlUp}>{(quad.skill.length / closed.length * 100).toFixed(0)}%</span></div>
                    <div><span className={c.textMuted}>구조 문제:</span> <span className="font-mono text-sky-500">{(quad.structure.length / closed.length * 100).toFixed(0)}%</span></div>
                  </div>
                  <p className={"mt-3 text-xs leading-relaxed " + c.textMuted}>
                    손실이 <span className="text-sky-500">구조 문제</span>에 몰리면 종목 선정이 아니라 트레이드 구성을 고쳐야 한다.<br/>
                    수익이 <span className="text-amber-500">운</span>에 쌓이면 곧 토해낼 신호다.
                  </p>
                </div>

                <details className="group">
                  <summary className={"cursor-pointer text-xs py-2 transition-colors " + c.textMuted + " hover:text-amber-600"}>전체 청산 기록 보기 ▾</summary>
                  <div className="mt-2 space-y-2">
                    {closed.map(t => {
                      const q = quadrant(t);
                      const bColors = { skill: c.closedBorderSkill, luck: c.closedBorderLuck, structure: c.closedBorderStruct, normal: c.closedBorderNormal };
                      const qLabels = { skill: "실력", luck: "운", structure: "구조", normal: "정상" };
                      return (
                        <div key={t.id} className={"rounded-md border p-3 border-l-2 " + c.closedBg + " " + bColors[q]}>
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <span className={"font-mono font-semibold text-sm " + c.text}>{t.ticker}</span>
                              <span className={"text-xs " + (t.direction === "long" ? c.pnlUp : c.pnlDown)}>{t.direction === "long" ? "롱" : "숏"}</span>
                              <span className={"text-xs " + c.textMuted}>{qLabels[q]}</span>
                            </div>
                            <span className={"font-mono text-sm font-semibold " + (t.pnl >= 0 ? c.pnlUp : c.pnlDown)}>{t.pnl >= 0 ? "+" : ""}{fmtMoney(t.pnl)}</span>
                          </div>
                          <p className={"mt-1 text-xs " + c.textSub}>{t.thesis}</p>
                          {t.note && <p className={"mt-1 text-xs italic " + c.textMuted}>"{t.note}"</p>}
                          <div className={"mt-1 text-xs " + c.textMuted}>{fmtDate(t.entryDate)} → {fmtDate(t.closedAt)} · {t.entryPrice} → {t.exitPrice}</div>
                        </div>
                      );
                    })}
                  </div>
                </details>
              </>
            )}
            {trades.length > 0 && (
              <button onClick={() => { if (confirm("모든 기록을 삭제할까? 되돌릴 수 없음.")) { setTrades([]); showToast("초기화 완료"); }}} className={"text-xs transition-colors mt-4 " + c.textMuted + " hover:text-rose-500"}>전체 데이터 초기화</button>
            )}
          </div>
        )}

        {/* ========== JOURNAL ========== */}
        {view === "journal" && (
          <div className="space-y-4">
            {editingId === null ? (
              <>
                {/* breadcrumb + actions */}
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div className="flex flex-wrap items-center gap-1 text-sm">
                    <button onClick={() => setCurFolder(null)} className={"transition-colors " + (curFolder === null ? c.text + " font-semibold" : c.textSub + " hover:text-amber-600")}>📁 전체</button>
                    {crumbs.map(f => (
                      <span key={f.id} className="flex items-center gap-1">
                        <span className={c.textMuted}>/</span>
                        <button onClick={() => setCurFolder(f.id)} className={"transition-colors " + (curFolder === f.id ? c.text + " font-semibold" : c.textSub + " hover:text-amber-600")}>{f.name}</button>
                      </span>
                    ))}
                  </div>
                  <div className="flex gap-2">
                    <button onClick={addFolder} className={"rounded-md border px-3 py-1.5 text-xs transition-colors " + c.btnSecondary}>+ 폴더</button>
                    <button onClick={newNote} className={"rounded-md px-3 py-1.5 text-xs font-medium transition-colors " + c.btnPrimary}>+ 새 글</button>
                  </div>
                </div>

                {/* subfolders */}
                {subfolders.length > 0 && (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    {subfolders.map(f => {
                      const ids = descendantFolderIds(f.id);
                      const cnt = journal.notes.filter(n => ids.includes(n.folderId)).length;
                      return (
                        <div key={f.id} onClick={() => setCurFolder(f.id)} className={"group cursor-pointer rounded-lg border p-3 transition-colors " + c.border + " " + c.borderHover + " " + c.cardInner}>
                          <div className="flex items-start justify-between">
                            <span className="text-lg leading-none">📁</span>
                            <div className="flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                              <button onClick={(e) => renameFolder(f.id, e)} className={"text-xs " + c.textMuted + " hover:text-amber-600"}>✎</button>
                              <button onClick={(e) => deleteFolder(f.id, e)} className={"text-xs " + c.textMuted + " hover:text-rose-500"}>✕</button>
                            </div>
                          </div>
                          <div className={"mt-2 truncate text-sm font-medium " + c.text}>{f.name}</div>
                          <div className={"text-xs " + c.textMuted}>{cnt}개</div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* notes in this folder */}
                {notesHere.length === 0 && subfolders.length === 0 ? (
                  <div className={c.card + " p-10 text-center text-sm " + c.textSub}>
                    {curFolder === null ? "아직 일지가 없음." : "이 폴더는 비어있음."}<br/>
                    <span className={c.textMuted}>폴더로 월·일을 나누고, 줄글로 그날의 생각을 남겨라.</span>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {notesHere.map(n => (
                      <div key={n.id} onClick={() => openNote(n)} className={"cursor-pointer rounded-lg border p-4 transition-colors " + c.closedBg + " " + c.borderHover}>
                        <div className="flex items-baseline justify-between gap-3">
                          <span className={"truncate text-sm font-semibold " + c.text}>{n.title || "(제목 없음)"}</span>
                          <span className={"shrink-0 font-mono text-xs " + c.textMuted}>{fmtDate(n.date)}</span>
                        </div>
                        <p className={"mt-1.5 line-clamp-2 whitespace-pre-wrap text-xs leading-relaxed " + c.textSub}>{n.body || "—"}</p>
                      </div>
                    ))}
                  </div>
                )}

                <div className={"flex gap-3 pt-2 text-xs"}>
                  <button onClick={exportJournal} className={c.textMuted + " hover:text-amber-600 transition-colors"}>↓ 일지 내보내기</button>
                  <button onClick={importJournal} className={c.textMuted + " hover:text-amber-600 transition-colors"}>↑ 일지 불러오기</button>
                </div>
              </>
            ) : (
              /* ---- editor ---- */
              <div className={c.card + " p-5 sm:p-6"}>
                <div className="mb-4 flex items-center justify-between">
                  <button onClick={() => setEditingId(null)} className={"text-sm transition-colors " + c.textSub + " hover:text-amber-600"}>← 목록</button>
                  <div className="flex items-center gap-3">
                    {editingId !== "new" && <button onClick={() => deleteNote(editingId)} className={"text-xs transition-colors " + c.textMuted + " hover:text-rose-500"}>삭제</button>}
                    <button onClick={saveNote} className={"rounded-md px-4 py-1.5 text-xs font-medium transition-colors " + c.btnPrimary}>저장</button>
                  </div>
                </div>
                <div className="mb-3 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
                  <input className={c.input + " sm:flex-1"} value={draft.title} onChange={e => setDraft(d => ({ ...d, title: e.target.value }))} placeholder="제목 (선택)" />
                  <input type="date" className={c.input + " sm:w-44"} value={draft.date} onChange={e => setDraft(d => ({ ...d, date: e.target.value }))} />
                </div>
                <textarea
                  autoFocus
                  className={c.input + " resize-none leading-relaxed"}
                  style={{ minHeight: "55vh", fontSize: "0.95rem" }}
                  value={draft.body}
                  onChange={e => setDraft(d => ({ ...d, body: e.target.value }))}
                  placeholder={"그날의 시장, 포지션, 심리, 판단을 줄글로.\n\n맞았든 틀렸든 '왜 그렇게 생각했는지'를 남겨두면 나중에 복기할 때 가장 비싼 데이터가 된다."}
                />
                {crumbs.length > 0 && <p className={"mt-2 text-xs " + c.textMuted}>저장 위치: {crumbs.map(f => f.name).join(" / ")}</p>}
              </div>
            )}
          </div>
        )}

        <div className={"mt-12 pb-8 text-center text-xs " + c.footer}>
          분석 70점인데 트레이드 구성이 40점이라 결과가 50점에 머무는 구조를 깨라.
        </div>
      </div>
    </div>
  );
}

function QuadCard({ c, title, sub, qKey, note, list }) {
  const styles = c["q" + qKey.charAt(0).toUpperCase() + qKey.slice(1)];
  const titleC = c["q" + qKey.charAt(0).toUpperCase() + qKey.slice(1) + "Text"];
  const numC = c["q" + qKey.charAt(0).toUpperCase() + qKey.slice(1) + "Num"];
  return (
    <div className={"rounded-lg border p-5 transition-colors " + styles}>
      <div className="flex items-baseline justify-between">
        <span className={"text-sm font-bold " + titleC}>{title}</span>
        <span className={"text-3xl font-bold font-mono " + numC}>{list.length}</span>
      </div>
      <div className={"text-xs mt-0.5 " + c.textSub}>{sub}</div>
      <div className={"mt-2 text-xs leading-relaxed " + c.textMuted}>{note}</div>
      {list.length > 0 && (
        <div className="mt-3 space-y-1.5 border-t border-black/5 pt-3">
          {list.map(t => (
            <div key={t.id} className="flex justify-between text-xs">
              <span className={"font-mono font-medium " + c.text}>{t.ticker}</span>
              <span className={"font-mono " + (t.pnl >= 0 ? c.pnlUp : c.pnlDown)}>{t.pnl >= 0 ? "+" : ""}{fmtMoney(t.pnl)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
